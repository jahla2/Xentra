name: CI
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend/control-plane, backend/runner]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
      - run: pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: [go, python, ui]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xentra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xentra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XENTRA_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/xentra?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e ./backend/ai-service
      - run: cd backend/control-plane && go mod tidy
      - run: cd backend/runner && go mod tidy
      - name: Generate integration master key
        run: echo "XENTRA_MASTER_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Run real infrastructure smoke
        run: |
          chmod +x tests/integration/smoke.sh
          tests/integration/smoke.sh
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-service-logs
          path: |
            /tmp/xentra-ai.log
            /tmp/xentra-runner.log
            /tmp/xentra-control.log
